name: Compiler discovery regression

on:
  push:
    branches:
      - fix/compiler-discovery-first-pass

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_declared_compiler_discovery_behavior.py -q

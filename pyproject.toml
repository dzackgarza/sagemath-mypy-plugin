[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-mypy-category-plugin"
version = "0.0.0"
description = "Invariant-core rewrite for Sage category provider MRO projection into mypy."
requires-python = ">=3.12"
dependencies = [
    "mypy==2.0.0",
    "packaging>=24,<27",
    "pydantic>=2.12,<3",
]

[tool.setuptools.packages.find]
include = ["sage_mypy_category_plugin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

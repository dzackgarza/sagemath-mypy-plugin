[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-mypy-category-plugin"
version = "0.0.0"
description = "Invariant-core rewrite for Sage category provider MRO projection into mypy."
requires-python = ">=3.12"
dependencies = [
    "mypy==2.0.0",
    "packaging>=24,<27",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
# PEP 561 sidecar stub package for Sage 10.7 infrastructure interfaces.
# When installed, mypy auto-discovers it and no mypy_path configuration is needed
# for sage.categories.*, sage.structure.*, sage.misc.*, etc.
# Install: sage -python -m pip install "sage-mypy-category-plugin[sage10_7]"
# (or: just install-sidecar)
sage10_7 = ["sage-stubs @ git+https://github.com/dzackgarza/sage-stubs@9b79045832f290541c399e50e48989e3e32f54c8"]

[tool.setuptools.packages.find]
include = ["sage_mypy_category_plugin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
